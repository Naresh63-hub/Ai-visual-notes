server.port=8080

# H2 Database (development)
spring.datasource.url=jdbc:h2:mem:visualnotes;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=${JWT_SECRET:VisualNotesStudyPlannerProductionSecretKey2026Secure256Bit}
jwt.expiration=86400000

# AI Provider (gemini | openai | offline)
ai.provider=${AI_PROVIDER:gemini}
ai.api-key=${AI_API_KEY:}
# ai.model only used when ai.provider=openai; ai.gemini-models is an ordered failover list
ai.model=${OPENAI_MODEL:gpt-4o}
ai.gemini-api-key=${GEMINI_API_KEY:}
ai.gemini-models=${GEMINI_MODELS:gemini-3.6-flash,gemini-3.8-flash,gemini-flash-lite-latest}
ai.gemini-endpoint=${GEMINI_ENDPOINT:https://generativelanguage.googleapis.com/v1beta/models}

# File upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
